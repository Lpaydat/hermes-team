model:
  default: glm-5.3
  provider: zai
  base_url: https://api.z.ai/api/coding/paas/v4
  context_length: 1000000
  rate_limit_delay: 30
toolsets:
  - hermes-cli
  - kanban
  - context_graph
disabled_toolsets:
  - browser
  - delegation
  - web
agent:
  api_max_retries: 10
  reasoning_effort: ultra
  max_turns: 200
kanban:
  max_in_progress_per_profile: 3
  max_in_progress: 6
  dispatch_stale_timeout_seconds: 14400
memory:
  provider: builtin
skills:
  disabled:
    - claude-code
    - codex
    - opencode
    - implement
    - tdd
    - prototype
    - codegraph
    - diagnosing-bugs
    - request-refactor-plan
    - improve-codebase-architecture
    - setup-pre-commit
    - git-guardrails-claude-code
    - resolving-merge-conflicts
    - migrate-to-shoehorn
    - ponytail
    - ponytail-debt
    - ponytail-help
    - ponytail-audit
    - ponytail-gain
    - ponytail-review
    - edit-article
    - writing-beats
    - writing-fragments
    - writing-shape
    - ask-matt
    - teach
    - wizard
    - scaffold-exercises
approvals:
  mode: 'off'
  destructive_slash_confirm: false
_config_version: 33
fallback_providers:
  - provider: deepseek
    model: deepseek-v4-flash
plugins:
  enabled:
    - kanban_chains
    - context_graph
    - loop_engine
  disabled: []
  entries:
    kanban_chains:
      allow_tool_override: false
onboarding:
  seen:
    tool_progress_prompt: true
